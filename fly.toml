# fly.toml app configuration file generated for beancount on 2026-05-20T11:36:45+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "p1meter-app"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  internal_port = 8080
  protocol = "tcp"
  [[services.ports]]
    port = 8080

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
